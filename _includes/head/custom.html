{% include base_path %}

<!-- start custom head snippets -->

<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v=2">
<meta name="theme-color" content="#FFFCE5">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MathJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  chtml: { scale: 0.88 },
  startup: {
    ready: function () {
      MathJax.startup.defaultReady();
      MathJax.typesetPromise();
    }
  }
};
</script>
<script>
(function () {
  var script = document.createElement('script');
  script.defer = true;
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.js';
  script.onerror = function () {
    var fallback = document.createElement('script');
    fallback.defer = true;
    fallback.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js';
    document.head.appendChild(fallback);
  };
  document.head.appendChild(script);
})();
</script>

<!-- end custom head snippets -->
