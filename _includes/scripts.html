<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.querySelector(".theme-toggle");

    function prefersDark() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function storedTheme() {
      try {
        return localStorage.getItem("theme");
      } catch (e) {
        return null;
      }
    }

    function saveTheme(theme) {
      try {
        localStorage.setItem("theme", theme);
      } catch (e) {}
    }

    function applyTheme(theme) {
      var isDark = theme === "dark" || (!theme && prefersDark());
      root.classList.toggle("theme-dark", isDark);
      root.classList.toggle("theme-light", !isDark);

      if (!toggle) return;
      toggle.setAttribute("aria-pressed", isDark ? "true" : "false");
      toggle.setAttribute("title", isDark ? "Switch to light mode" : "Switch to dark mode");
      toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");

      var icon = toggle.querySelector(".theme-toggle__icon");
      if (icon) {
        icon.classList.toggle("fa-moon", !isDark);
        icon.classList.toggle("fa-sun", isDark);
      }
    }

    applyTheme(storedTheme());

    if (window.matchMedia) {
      var systemDark = window.matchMedia("(prefers-color-scheme: dark)");
      var onSystemChange = function () {
        if (!storedTheme()) applyTheme(null);
      };
      if (systemDark.addEventListener) {
        systemDark.addEventListener("change", onSystemChange);
      } else if (systemDark.addListener) {
        systemDark.addListener(onSystemChange);
      }
    }

    if (toggle) {
      toggle.addEventListener("click", function () {
        var nextTheme = root.classList.contains("theme-dark") ? "light" : "dark";
        saveTheme(nextTheme);
        applyTheme(nextTheme);
      });
    }

    var styleToggle = document.querySelector(".style-toggle");

    function storedStyle() {
      try {
        return localStorage.getItem("style");
      } catch (e) {
        return null;
      }
    }

    function saveStyle(style) {
      try {
        localStorage.setItem("style", style);
      } catch (e) {}
    }

    function applyStyle(style) {
      var isRetro = style !== "classic";
      root.classList.toggle("style-retro", isRetro);
      root.classList.toggle("style-classic", !isRetro);

      if (!styleToggle) return;
      var label = isRetro ? "Switch to the classic style" : "Switch to the retro style";
      styleToggle.setAttribute("aria-pressed", isRetro ? "true" : "false");
      styleToggle.setAttribute("title", label);
      styleToggle.setAttribute("aria-label", label);
    }

    applyStyle(storedStyle());

    if (styleToggle) {
      styleToggle.addEventListener("click", function () {
        var nextStyle = root.classList.contains("style-retro") ? "classic" : "retro";
        saveStyle(nextStyle);
        applyStyle(nextStyle);
      });
    }
  })();
</script>

<script>
  (function () {
    var plural = function (n, w) { return n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's'); };

    /* The counter API answers 404 with a valid `{"count": "0"}` body for a path
       nobody has visited yet, so read the body regardless of the status code.
       Block comment on purpose: _layouts/compress.html strips newlines, which
       turns a // comment into a comment over the rest of the script. */
    var count = function (path) {
      return fetch('https://zhiwang.goatcounter.com/counter/' + path + '.json')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var views = parseInt(d.count, 10), visitors = parseInt(d.count_unique, 10);
          return isNaN(views) || isNaN(visitors) ? null : { views: views, visitors: visitors };
        });
    };

    var total = document.getElementById('visitor-count');
    if (total) {
      count('TOTAL').then(function (c) {
        if (!c) { return; }
        document.getElementById('visitor-count-text').textContent = plural(c.views, 'view') + ' \u00b7 ' + plural(c.visitors, 'visitor');
        total.hidden = false;
      }).catch(function () {});
    }

    var post = document.getElementById('post-views');
    if (post) {
      count(post.dataset.path).then(function (c) {
        if (!c || c.views === 0) { return; }
        document.getElementById('post-views-text').textContent = plural(c.views, 'view');
        post.hidden = false;
      }).catch(function () {});
    }
  })();
</script>

<script>
  /* Post layout (rails: true): builds the left section menu from the post's h2s
     and places margin notes beside their reference on wide screens.
     Block comments only: _layouts/compress.html strips newlines. */
  (function () {
    var main = document.querySelector(".main--rails");
    if (!main) { return; }
    var content = main.querySelector(".page__content");
    var rail = main.querySelector(".post-rail");
    var list = rail.querySelector(".post-rail__links");
    var toggle = rail.querySelector(".post-rail__toggle");
    var heads = [].slice.call(content.querySelectorAll("h2"));

    heads.forEach(function (h, i) {
      if (!h.id) { h.id = "section-" + (i + 1); }
      var a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.getAttribute("data-nav-label") || h.textContent;
      list.appendChild(a);
    });
    var links = [].slice.call(list.querySelectorAll("a"));

    function markCurrent() {
      var current = heads[0];
      heads.forEach(function (h) {
        if (h.getBoundingClientRect().top <= 120) { current = h; }
      });
      links.forEach(function (a) {
        if (current && a.hash === "#" + current.id) {
          a.setAttribute("aria-current", "location");
        } else {
          a.removeAttribute("aria-current");
        }
      });
    }
    window.addEventListener("scroll", markCurrent, { passive: true });
    markCurrent();

    function setOpen(open) {
      rail.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    toggle.addEventListener("click", function () {
      setOpen(!rail.classList.contains("is-open"));
    });
    /* The theme binds jQuery smoothScroll to every link once the page is ready;
       these listeners are registered first, so they take over menu clicks. */
    links.forEach(function (a) {
      a.addEventListener("click", function (e) {
        var target = document.getElementById(a.hash.slice(1));
        if (!target) { return; }
        e.preventDefault();
        e.stopImmediatePropagation();
        setOpen(false);
        target.scrollIntoView();
        history.pushState(null, "", a.hash);
      });
    });

    var notes = [].slice.call(content.querySelectorAll(".margin-note"));
    if (!notes.length) { return; }
    var wide = window.matchMedia("(min-width: 1300px)");
    var pending = false;

    function placeNotes() {
      pending = false;
      main.classList.toggle("rails-notes-wide", wide.matches);
      var origin = content.getBoundingClientRect().top;
      var bottom = 0;
      notes.forEach(function (note) {
        if (!wide.matches) { note.style.top = ""; return; }
        var ref = document.getElementById(note.id.replace("margin-note", "note-ref"));
        var wanted = ref ? ref.getBoundingClientRect().top - origin - 6 : bottom;
        var top = Math.max(wanted, bottom);
        note.style.top = top + "px";
        bottom = top + note.offsetHeight + 16;
      });
    }
    function schedule() {
      if (!pending) { pending = true; window.requestAnimationFrame(placeNotes); }
    }

    window.addEventListener("resize", schedule);
    window.addEventListener("load", schedule);
    if (window.ResizeObserver) { new ResizeObserver(schedule).observe(content); }
    placeNotes();
  })();
</script>
