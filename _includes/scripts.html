<script>
  (function () {
    var root = document.documentElement;
    var toggle = document.querySelector(".theme-toggle");

    function prefersDark() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function storedTheme() {
      try {
        return localStorage.getItem("theme");
      } catch (e) {
        return null;
      }
    }

    function saveTheme(theme) {
      try {
        localStorage.setItem("theme", theme);
      } catch (e) {}
    }

    function applyTheme(theme) {
      var isDark = theme === "dark" || (!theme && prefersDark());
      root.classList.toggle("theme-dark", isDark);
      root.classList.toggle("theme-light", !isDark);

      if (!toggle) return;
      toggle.setAttribute("aria-pressed", isDark ? "true" : "false");
      toggle.setAttribute("title", isDark ? "Switch to light mode" : "Switch to dark mode");
      toggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");

      var icon = toggle.querySelector(".theme-toggle__icon");
      if (icon) {
        icon.classList.toggle("fa-moon", !isDark);
        icon.classList.toggle("fa-sun", isDark);
      }
    }

    applyTheme(storedTheme());

    if (toggle) {
      toggle.addEventListener("click", function () {
        var nextTheme = root.classList.contains("theme-dark") ? "light" : "dark";
        saveTheme(nextTheme);
        applyTheme(nextTheme);
      });
    }

    var styleToggle = document.querySelector(".style-toggle");

    function storedStyle() {
      try {
        return localStorage.getItem("style");
      } catch (e) {
        return null;
      }
    }

    function saveStyle(style) {
      try {
        localStorage.setItem("style", style);
      } catch (e) {}
    }

    function applyStyle(style) {
      var isRetro = style !== "classic";
      root.classList.toggle("style-retro", isRetro);
      root.classList.toggle("style-classic", !isRetro);

      if (!styleToggle) return;
      var label = isRetro ? "Switch to the classic style" : "Switch to the retro style";
      styleToggle.setAttribute("aria-pressed", isRetro ? "true" : "false");
      styleToggle.setAttribute("title", label);
      styleToggle.setAttribute("aria-label", label);
    }

    applyStyle(storedStyle());

    if (styleToggle) {
      styleToggle.addEventListener("click", function () {
        var nextStyle = root.classList.contains("style-retro") ? "classic" : "retro";
        saveStyle(nextStyle);
        applyStyle(nextStyle);
      });
    }
  })();
</script>

<script>
  (function () {
    var el = document.getElementById('visitor-count');
    if (!el) { return; }
    fetch('https://zhiwang.goatcounter.com/counter/TOTAL.json')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        var plural = function (n, w) { return n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's'); };
        var views = parseInt(d.count, 10), visitors = parseInt(d.count_unique, 10);
        if (isNaN(views) || isNaN(visitors)) { return; }
        document.getElementById('visitor-count-text').textContent = plural(views, 'view') + ' \u00b7 ' + plural(visitors, 'visitor');
        el.hidden = false;
      })
      .catch(function () {});
  })();
</script>
