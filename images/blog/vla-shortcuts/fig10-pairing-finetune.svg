<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 580 240" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect y="25" width="580" height="240" fill="#ffffff"/>
  <!-- y = 220 - 2 * percent; instructions name the object -->
  <line x1="50" y1="220" x2="410" y2="220" stroke="#424242"/>
  <line x1="50" y1="40" x2="50" y2="220" stroke="#424242"/>
  <g font-size="10" fill="#555" text-anchor="end"><text x="44" y="224">0%</text><text x="44" y="184">20%</text><text x="44" y="144">40%</text><text x="44" y="104">60%</text><text x="44" y="64">80%</text></g>
  <g stroke="#eeeeee"><line x1="50" y1="180" x2="410" y2="180"/><line x1="50" y1="140" x2="410" y2="140"/><line x1="50" y1="100" x2="410" y2="100"/><line x1="50" y1="60" x2="410" y2="60"/></g>
  <!-- E1 -->
  <rect x="90" y="181.4" width="36" height="38.6" fill="#9e9e9e"/>
  <rect x="132" y="219" width="36" height="1" fill="#1565c0"/>
  <rect x="174" y="181" width="36" height="39" fill="#ef6c00"/>
  <!-- E2 -->
  <rect x="270" y="62.6" width="36" height="157.4" fill="#9e9e9e"/>
  <rect x="312" y="55" width="36" height="165" fill="#1565c0"/>
  <rect x="354" y="97" width="36" height="123" fill="#ef6c00"/>
  <!-- 95% intervals -->
  <g stroke="#212121">
    <line x1="108" y1="189.4" x2="108" y2="171.6"/><line x1="150" y1="219.8" x2="150" y2="214.4"/><line x1="192" y1="190.8" x2="192" y2="169"/>
    <line x1="288" y1="72.6" x2="288" y2="54.2"/><line x1="330" y1="66.8" x2="330" y2="45.8"/><line x1="372" y1="110.8" x2="372" y2="84"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="108" y="166">19.3</text><text x="150" y="209">0.5</text><text x="192" y="164">19.5</text>
    <text x="288" y="49">78.7</text><text x="330" y="41">82.5</text><text x="372" y="79">61.5</text>
  </g>
  <g text-anchor="middle">
    <text x="150" y="238" font-weight="bold">E1</text><text x="150" y="252" font-size="10" fill="#757575">scene shortcut</text>
    <text x="330" y="238" font-weight="bold">E2</text><text x="330" y="252" font-size="10" fill="#757575">instruction shortcut</text>
  </g>
  <!-- legend -->
  <g font-size="11">
    <rect x="425" y="60" width="12" height="12" fill="#9e9e9e"/><text x="443" y="70">original</text>
    <rect x="425" y="92" width="12" height="12" fill="#1565c0"/><text x="443" y="102">new-request arm</text>
    <text x="443" y="116" font-size="10" fill="#757575">breaks scene → instruction</text>
    <rect x="425" y="138" width="12" height="12" fill="#ef6c00"/><text x="443" y="148">new-position arm</text>
    <text x="443" y="162" font-size="10" fill="#757575">breaks object → position</text>
  </g>
</svg>
