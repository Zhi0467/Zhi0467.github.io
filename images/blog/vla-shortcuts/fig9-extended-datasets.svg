<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 45 780 405" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="780" height="470" fill="#ffffff"/>
  <!-- column headers -->
  <g text-anchor="middle" font-weight="bold" font-size="12">
    <text x="257" y="62">original demo (for reference)</text>
    <text x="462" y="62">breaking half</text>
    <text x="667" y="62">matched half</text>
  </g>
  <!-- row labels -->
  <g font-size="11">
    <text x="15" y="110" font-weight="bold" font-size="12" fill="#1565c0">new-request arm</text>
    <text x="15" y="130">breaks: scene →</text>
    <text x="15" y="144">instruction</text>
    <text x="15" y="164">keeps: each object</text>
    <text x="15" y="178">at its own position</text>
    <text x="15" y="300" font-weight="bold" font-size="12" fill="#ef6c00">new-position arm</text>
    <text x="15" y="320">breaks: object →</text>
    <text x="15" y="334">position</text>
    <text x="15" y="354">keeps: one request</text>
    <text x="15" y="368">per scene</text>
  </g>
  <!-- scene tables -->
  <g fill="#f6efe2" stroke="#8d6e63">
    <rect x="170" y="75" width="175" height="110" rx="6"/><rect x="375" y="75" width="175" height="110" rx="6"/><rect x="580" y="75" width="175" height="110" rx="6"/>
    <rect x="170" y="265" width="175" height="110" rx="6"/><rect x="375" y="265" width="175" height="110" rx="6"/><rect x="580" y="265" width="175" height="110" rx="6"/>
  </g>
  <!-- baskets -->
  <g fill="#d7ccc8" stroke="#6d4c41">
    <rect x="300" y="145" width="38" height="30" rx="4"/><rect x="505" y="145" width="38" height="30" rx="4"/><rect x="710" y="145" width="38" height="30" rx="4"/>
    <rect x="300" y="335" width="38" height="30" rx="4"/><rect x="505" y="335" width="38" height="30" rx="4"/><rect x="710" y="335" width="38" height="30" rx="4"/>
  </g>
  <g font-size="8.5" text-anchor="middle" fill="#4e342e">
    <text x="319" y="163">basket</text><text x="524" y="163">basket</text><text x="729" y="163">basket</text>
    <text x="319" y="353">basket</text><text x="524" y="353">basket</text><text x="729" y="353">basket</text>
  </g>
  <!-- far positions (G2-G4) -->
  <g fill="none" stroke="#757575" stroke-dasharray="3,2">
    <circle cx="195" cy="167" r="10"/><circle cx="245" cy="170" r="10"/>
    <circle cx="400" cy="167" r="10"/><circle cx="450" cy="170" r="10"/>
    <circle cx="605" cy="167" r="10"/><circle cx="655" cy="170" r="10"/>
    <circle cx="195" cy="357" r="10"/><circle cx="245" cy="360" r="10"/>
    <circle cx="400" cy="357" r="10"/>
    <circle cx="605" cy="357" r="10"/><circle cx="655" cy="360" r="10"/>
  </g>
  <g font-size="8" text-anchor="middle" fill="#757575">
    <text x="195" y="170">G</text><text x="245" y="173">G</text>
    <text x="450" y="173">G</text>
    <text x="655" y="173">G</text>
    <text x="195" y="360">G</text><text x="245" y="363">G</text>
    <text x="400" y="360">G</text>
    <text x="605" y="360">G</text><text x="655" y="363">G</text>
  </g>
  <!-- other object Y -->
  <g fill="#ffffff" stroke="#9e9e9e" stroke-width="2">
    <circle cx="280" cy="110" r="14"/><circle cx="485" cy="110" r="14"/><circle cx="690" cy="110" r="14"/>
    <circle cx="280" cy="300" r="14"/><circle cx="485" cy="300" r="14"/><circle cx="690" cy="300" r="14"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#616161">
    <text x="280" y="114">Y</text><text x="485" y="114">Y</text><text x="690" y="114">Y</text>
    <text x="280" y="304">Y</text><text x="485" y="304">Y</text><text x="690" y="304">Y</text>
  </g>
  <!-- trained object X at its own position -->
  <g fill="#ffffff" stroke="#c62828" stroke-width="2.5">
    <circle cx="215" cy="115" r="14"/><circle cx="420" cy="115" r="14"/><circle cx="625" cy="115" r="14"/>
    <circle cx="215" cy="305" r="14"/><circle cx="625" cy="305" r="14"/>
    <circle cx="450" cy="360" r="14"/>
  </g>
  <!-- X's old position in the new-position breaking demo -->
  <circle cx="420" cy="305" r="14" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="425" y1="320" x2="444" y2="344" stroke="#c62828" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="11" text-anchor="middle" font-weight="bold" fill="#c62828">
    <text x="215" y="119">X</text><text x="420" y="119">X</text><text x="625" y="119">X</text>
    <text x="215" y="309">X</text><text x="625" y="309">X</text>
    <text x="450" y="364">X</text>
  </g>
  <!-- popcorn at a far position -->
  <circle cx="400" cy="167" r="11" fill="#6a1b9a"/><circle cx="605" cy="167" r="11" fill="#6a1b9a"/>
  <g font-size="10" text-anchor="middle" font-weight="bold" fill="#ffffff"><text x="400" y="171">P</text><text x="605" y="171">P</text></g>
  <!-- instructions -->
  <g font-size="11" text-anchor="middle" font-style="italic">
    <text x="257" y="205">"pick up X …"</text>
    <text x="462" y="205">"pick up the popcorn …"</text>
    <text x="667" y="205">"pick up X …"</text>
    <text x="257" y="395">"pick up X …"</text>
    <text x="462" y="395">"pick up X …"</text>
    <text x="667" y="395">"pick up X …"</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="462" y="223" fill="#1565c0">this scene now has two requests</text>
    <text x="667" y="223" fill="#555">popcorn present, usual request</text>
    <text x="462" y="413" fill="#ef6c00">X is now trained at a second position</text>
    <text x="667" y="413" fill="#555">plain scene, usual request</text>
  </g>
  <!-- legend -->
  <text x="390" y="440" text-anchor="middle" font-size="11" fill="#555">X = the scene's trained object · Y = another object · P = popcorn · G = far positions G2–G4, where no test object stands</text>
</svg>
