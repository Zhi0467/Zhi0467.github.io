    <text x="400" y="52">fine-tuning data</text>
    <text x="20" y="190">+ new-request arm</text>
    <text x="400" y="190">+ new-position arm</text>
  </g>
  <g font-size="10" fill="#757575" text-anchor="middle">
    <text x="100" y="72">scene</text><text x="270" y="72">instruction</text>
    <text x="480" y="72">object</text><text x="650" y="72">position</text>
  </g>
