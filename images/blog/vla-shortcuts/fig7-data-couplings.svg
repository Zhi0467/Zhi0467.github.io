    <rect x="230" y="200" width="80" height="24" rx="4"/><rect x="230" y="230" width="80" height="24" rx="4"/><rect x="230" y="260" width="80" height="24" rx="4"/>
    <!-- right, before -->
    <rect x="440" y="78" width="80" height="24" rx="4"/><rect x="440" y="108" width="80" height="24" rx="4"/><rect x="440" y="138" width="80" height="24" rx="4"/>
    <rect x="610" y="78" width="80" height="24" rx="4"/><rect x="610" y="108" width="80" height="24" rx="4"/><rect x="610" y="138" width="80" height="24" rx="4"/>
    <!-- right, after -->
    <rect x="440" y="200" width="80" height="24" rx="4"/><rect x="440" y="230" width="80" height="24" rx="4"/><rect x="440" y="260" width="80" height="24" rx="4"/>
    <rect x="610" y="200" width="80" height="24" rx="4"/><rect x="610" y="230" width="80" height="24" rx="4"/><rect x="610" y="260" width="80" height="24" rx="4"/>
  </g>
  <rect x="230" y="290" width="80" height="24" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#ef6c00" stroke-width="1.5">
