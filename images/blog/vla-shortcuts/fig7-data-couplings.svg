<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
  </defs>
  <rect width="760" height="390" fill="#ffffff"/>
  <line x1="380" y1="10" x2="380" y2="380" stroke="#e0e0e0"/>
  <!-- headers -->
  <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">scene → instruction (E1)</text>
  <text x="570" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef6c00">object → position (E2)</text>
  <g font-size="11.5" font-weight="bold" fill="#424242">
