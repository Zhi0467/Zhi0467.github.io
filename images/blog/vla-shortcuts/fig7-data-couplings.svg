    <line x1="142" y1="212" x2="228" y2="212"/><line x1="142" y1="242" x2="228" y2="242"/><line x1="142" y1="272" x2="228" y2="272"/>
    <line x1="522" y1="90" x2="608" y2="90"/><line x1="522" y1="120" x2="608" y2="120"/><line x1="522" y1="150" x2="608" y2="150"/>
    <line x1="522" y1="212" x2="608" y2="212"/><line x1="522" y1="242" x2="608" y2="242"/><line x1="522" y1="272" x2="608" y2="272"/>
