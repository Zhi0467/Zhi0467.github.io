    <text x="480" y="216">milk</text><text x="480" y="246">butter</text><text x="480" y="276">soup</text>
    <text x="650" y="216">position 1</text><text x="650" y="246">position 2</text><text x="650" y="276">position 3</text>
    <text x="650" y="306" fill="#ef6c00">G2</text><text x="650" y="336" fill="#ef6c00">G3</text><text x="650" y="366" fill="#ef6c00">G4</text>
  </g>
