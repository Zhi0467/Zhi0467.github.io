<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
  </defs>
  <rect width="720" height="360" fill="#ffffff"/>
  <!-- inputs -->
  <rect x="20" y="75" width="130" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="85" y="105" text-anchor="middle" font-weight="bold">Scene</text>
  <rect x="20" y="235" width="130" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="85" y="265" text-anchor="middle" font-weight="bold">Instruction</text>
  <!-- grounding -->
  <rect x="285" y="147" width="205" height="66" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="387" y="175" text-anchor="middle" font-weight="bold">ground the instruction</text>
  <text x="387" y="195" text-anchor="middle" font-size="12">find the requested object now</text>
  <rect x="570" y="155" width="130" height="50" rx="6" fill="#f5f5f5" stroke="#424242"/>
  <text x="635" y="185" text-anchor="middle" font-weight="bold">Reach</text>
  <line x1="150" y1="105" x2="283" y2="170" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="150" y1="255" x2="283" y2="190" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="490" y1="180" x2="568" y2="180" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#g)"/>
  <!-- shortcuts: curves stay well clear of their labels -->
  <path d="M150,85 C330,20 560,20 635,153" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#r)"/>
  <text x="390" y="24" text-anchor="middle" fill="#c62828" font-weight="bold">scene shortcut → E1</text>
  <path d="M150,275 C330,340 560,340 635,207" fill="none" stroke="#ef6c00" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#o)"/>
  <text x="390" y="350" text-anchor="middle" fill="#ef6c00" font-weight="bold">instruction shortcut → E2</text>
</svg>
